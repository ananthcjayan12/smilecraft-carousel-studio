[package]
name = "carousel-studio"
version = "0.1.0"
description = "Lightweight local-first Carousel Studio desktop app"
authors = ["Carousel Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.9.5", features = [] }
tauri-runtime = "=2.9.2" # keep runtime trait API aligned with tauri-runtime-wry 2.9.3
tauri-runtime-wry = "=2.9.3" # stay on pre-tao-0.35 runtime
wry = "=0.53.4" # API-compatible with tauri-runtime-wry 2.9.3
tao = "=0.34.8" # exact macOS-26-safe window runtime; avoid tao 0.35.3 startup abort
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "fs", "time"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
keyring = "3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
include_dir = "0.7"
mime_guess = "2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
