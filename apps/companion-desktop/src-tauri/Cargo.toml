[package]
name = "smilecraft-companion"
version = "0.1.0"
description = "Local AI companion for Smilecraft"
authors = ["Smilecraft"]
license = "MIT"
edition = "2021"

[lib]
name = "smilecraft_companion"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tempfile = "3"
url = "2"
regex = "1"
dirs = "6"
uuid = { version = "1", features = ["serde"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
