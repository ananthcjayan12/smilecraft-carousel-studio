name: Bootstrap v.a.1 desktop source

on:
  push:
    branches: [v.a.1]
    paths:
      - ".va1-bootstrap/**"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand desktop source payload
        shell: bash
        run: |
          base64 -d .va1-bootstrap/payload.zip.b64 > /tmp/va1-desktop.zip
          unzip -oq /tmp/va1-desktop.zip -d .

      - name: Commit generated desktop source
        shell: bash
        run: |
          rm -rf .va1-bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add lightweight Tauri desktop architecture"
          git push origin HEAD:v.a.1
