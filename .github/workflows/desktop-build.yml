name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
    branches: [v.a.1]
    paths:
      - "src-tauri/**"
      - "web/**"
      - "desktop-shell/**"
      - "package.json"
      - ".github/workflows/desktop-build.yml"
  push:
    branches: [v.a.1]
    paths:
      - "src-tauri/**"
      - "web/**"
      - "desktop-shell/**"
      - "package.json"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS universal DMG
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - name: Verify macOS runtime version
        shell: bash
        run: |
          cargo tree --manifest-path src-tauri/Cargo.toml -i tao | tee /tmp/tao-tree.txt
          grep -q "tao v0.34.8" /tmp/tao-tree.txt
          if grep -q "tao v0.35.3" /tmp/tao-tree.txt; then
            echo "Broken macOS 26 tao runtime resolved unexpectedly."
            exit 1
          fi
      - name: Build universal DMG
        run: npm run desktop:build -- --target universal-apple-darwin --bundles dmg
      - name: Launch smoke test from packaged DMG on macOS 26
        shell: bash
        run: |
          DMG="$(find src-tauri/target -type f -name '*.dmg' -print -quit)"
          if [ -z "$DMG" ]; then
            echo "Built DMG not found"
            exit 1
          fi
          MOUNT_POINT="$(mktemp -d /tmp/carousel-studio-mount.XXXXXX)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet -force 2>/dev/null || true
            rmdir "$MOUNT_POINT" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          APP="$MOUNT_POINT/Carousel Studio.app"
          if [ ! -d "$APP" ]; then
            echo "Carousel Studio.app not found inside DMG"
            find "$MOUNT_POINT" -maxdepth 2 -print
            exit 1
          fi
          "$APP/Contents/MacOS/carousel-studio" >/tmp/carousel-studio.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "Carousel Studio exited during startup:"
            cat /tmp/carousel-studio.log || true
            exit 1
          fi
          kill "$PID" || true
          wait "$PID" || true
          echo "Carousel Studio remained alive for the startup smoke-test window."
      - uses: actions/upload-artifact@v4
        with:
          name: carousel-studio-macos-dmg
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - name: Build NSIS EXE
        run: npm run desktop:build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: carousel-studio-windows-exe
          path: src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
