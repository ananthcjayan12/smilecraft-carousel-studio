name: Desktop builds

on:
  workflow_dispatch:
  pull_request:
    branches: [v.a.1]
    paths:
      - "src-tauri/**"
      - "web/**"
      - "desktop-shell/**"
      - "package.json"
      - ".github/workflows/desktop-build.yml"
  push:
    branches: [v.a.1]
    paths:
      - "src-tauri/**"
      - "web/**"
      - "desktop-shell/**"
      - "package.json"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

jobs:
  macos:
    name: macOS universal DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - name: Build universal DMG
        run: npm run desktop:build -- --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: carousel-studio-macos-dmg
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64 EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - name: Build NSIS EXE
        run: npm run desktop:build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: carousel-studio-windows-exe
          path: src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
